<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade Hub</title>
  <meta name="shopify-api-key" content="b6bb4cada236b8c323cfda44cdeb784f" />
  <!-- App Bridge must be the first script: it authenticates fetch('shopify:admin/...') -->
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Archivo+Black&display=swap">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="btn btn--ghost btn--icon" type="button" data-nav-toggle aria-label="Open menu"><span class="i" style="--i:url(https://cdn.jsdelivr.net/npm/lucide-static@0.544.0/icons/menu.svg)" aria-hidden="true"></span></button>
      <img src="assets/tapedup-logo-light.png" alt="TapedUp"><span class="app-name">Trade Hub</span>
    </header>
    <div class="scrim" data-nav-toggle></div>

    <aside class="sidebar">
      <a class="sidebar__logo" href="#/"><img src="assets/tapedup-logo-light.png" alt="TapedUp"><span class="app-name">Trade Hub</span></a>
      <nav class="nav" aria-label="Main" id="nav"></nav>
      <div class="sidebar__foot" id="sync-status" aria-live="polite"></div>
    </aside>

    <main class="main" id="main"></main>
  </div>
</body>
</html>
